name: Weekly coverage QA
on:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest
      - run: python -m pipeline.cli validate
      - run: python -m pipeline.cli build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            data/generated/coverage_report.json
            docs/COVERAGE_REPORT.md
