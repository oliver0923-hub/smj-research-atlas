name: Weekly coverage QA
on:
  schedule:
    - cron: '11 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: pip install -e '.[test]'
      - run: git fetch origin atlas-data || true
      - run: python -m pipeline.release restore
      - run: python -m pipeline.release restore --from-ref origin/atlas-data
      - run: python -m pytest
      - run: python -m pipeline.release gate
      - run: python -m pipeline.cli build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: data/generated/coverage_report.json
