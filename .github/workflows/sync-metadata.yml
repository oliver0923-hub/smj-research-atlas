name: Autonomous data release
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/sync-metadata.yml'
  schedule:
    - cron: '23 2 * * *'
    - cron: '47 3 * * 0'
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, weekly, batch, monthly]
        default: batch
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atlas-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: pip install -e '.[test]'
      - run: git fetch origin atlas-data || true
      - run: python -m pipeline.release restore
      - run: python -m pipeline.release restore --from-ref origin/atlas-data
      - name: Restore bounded prior checkpoints
        run: python -m pipeline.release restore-checkpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run bounded autonomous update
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mode="${REQUESTED_MODE:-daily}"
          if [ "$SCHEDULE" = '47 3 * * 0' ]; then mode=weekly; fi
          if [ "$SCHEDULE" = '17 4 1 * *' ]; then mode=monthly; fi
          case "$mode" in daily|weekly|batch|monthly) ;; *) echo "Unsupported mode"; exit 2 ;; esac
          python -m pipeline.release refresh --mode "$mode"
      - run: python -m pytest
      - run: python -m pipeline.release gate
      - run: python -m pipeline.cli build
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Commit validated data artifact only
        run: |
          git config user.name 'SMJ Atlas data bot'
          git config user.email 'atlas-bot@users.noreply.github.com'
          blob=$(git hash-object -w data/live_state.json.gz)
          sub=$(printf '100644 blob %s	live_state.json.gz\n' "$blob" | git mktree)
          tree=$(printf '040000 tree %s	data\n' "$sub" | git mktree)
          parent=$(git rev-parse --verify origin/atlas-data 2>/dev/null || true)
          if [ -n "$parent" ]; then
            commit=$(printf 'Validated automatic data release\n' | git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf 'Initial validated data release\n' | git commit-tree "$tree")
          fi
          git push origin "$commit:refs/heads/atlas-data"
          echo "PAGES_BUILD_VERSION=$commit" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy with bounded stale-lock recovery
        id: deployment
        run: python -m pipeline.publication --deploy
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the actual public build
        run: python -m pipeline.publication --url https://oliver0923-hub.github.io/smj-research-atlas/
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-diagnostics
          path: |
            data/staging/
            data/staging/last_error.json
            data/generated/coverage_report.json
            data/pipeline_history.jsonl
          if-no-files-found: ignore
