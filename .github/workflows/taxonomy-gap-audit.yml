name: Inspect unresolved SMJ abstracts
on:
  pull_request:
    paths:
      - 'pipeline/taxonomy_gap_audit.py'
      - 'data/ontology.yaml'
      - '.github/workflows/taxonomy-gap-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: git fetch origin atlas-data || true
      - run: python -m pipeline.release restore
      - run: python -m pipeline.release restore --from-ref origin/atlas-data
      - name: Inspect unresolved abstracts via OpenAlex (no copied abstract text)
        run: python -m pipeline.taxonomy_gap_audit --batches 24 --top 90
