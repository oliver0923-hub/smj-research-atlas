name: Pull request validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: pip install -e '.[test]'
      - run: git fetch origin atlas-data || true
      - run: python -m pipeline.release restore
      - run: python -m pipeline.release restore --from-ref origin/atlas-data
      - run: python -m pytest -q
      - run: python -m pipeline.release gate
      - run: python -m pipeline.cli build
      - run: npm ci
      - run: npm run test:oa
      - run: npm run check:oa
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
