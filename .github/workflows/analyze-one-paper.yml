name: Analyze one SMJ paper on demand
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      paper:
        description: 'Indexed SMJ DOI or near-exact title to analyze'
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: smj-on-demand-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  single-paper:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Atlas analyze:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest tests/test_on_demand.py
      - name: Load current live Atlas DOI records
        run: |
          git fetch origin atlas-data
          python -m pipeline.release restore --from-ref origin/atlas-data
      - name: Targeted OA retrieval and study-level evidence
        env:
          REQUESTED_PAPER: ${{ inputs.paper || '' }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python -m pipeline.on_demand --github-event "$GITHUB_EVENT_PATH"
          else
            python -m pipeline.on_demand --query "$REQUESTED_PAPER"
          fi
      - name: Preserve per-paper JSON and human-readable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smj-one-paper-${{ github.run_id }}
          path: data/staging/on_demand/
          if-no-files-found: ignore
          retention-days: 30
      - name: Deliver findings to the requested GitHub issue
        if: ${{ success() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file data/staging/on_demand/result.md
