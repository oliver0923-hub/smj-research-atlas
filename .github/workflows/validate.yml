name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -e '.[test]'
      - run: python -m pytest
      - run: python -m pipeline.cli validate
      - run: python -m pipeline.cli build
      - run: npm ci
      - run: npm run build
