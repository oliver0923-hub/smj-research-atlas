name: Wiley OA real PDF smoke
on:
  pull_request:
    paths:
      - 'pipeline/wiley.py'
      - 'pipeline/wiley_probe.py'
      - '.github/workflows/wiley-oa-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oa-pdf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - name: Probe 10.1002/smj.3735 lawful OA PDF and report outcome
        run: python -m pipeline.wiley_probe
