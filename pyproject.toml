[project]
name = "smj-research-atlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "PyMuPDF>=1.26,<2", "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["pipeline*"]
